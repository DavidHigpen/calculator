<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
  <meta name="theme-color" content="#000000" id="themeColorMeta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>Calculator</title>
</head>
<body>
  <div class="app" id="app">

    <header class="topbar">
      <button class="icon-btn ghost" id="historyBtn" aria-label="History">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/>
          <polyline points="3 4 3 10 9 10"/>
          <polyline points="12 7 12 12 15 14"/>
        </svg>
      </button>
      <button class="icon-btn ghost" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <circle cx="12" cy="5" r="2"/>
          <circle cx="12" cy="12" r="2"/>
          <circle cx="12" cy="19" r="2"/>
        </svg>
      </button>

      <div class="menu-popup" id="menuPopup" aria-hidden="true">
        <button class="menu-item" data-menu="converter">Converter</button>
        <button class="menu-item" data-menu="settings">Settings</button>
      </div>
    </header>

    <main class="view calc-view active" id="calcView">
      <div class="display-wrap">
        <div class="expression-row">
          <div class="expression" id="expression"></div>
        </div>
        <div class="preview" id="preview"></div>
      </div>

      <div class="chevron-wrap">
        <button class="chevron-btn" id="chevronBtn" aria-label="Toggle scientific">
          <svg class="chev-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="7 10 12 5 17 10"/>
            <polyline points="7 14 12 19 17 14"/>
          </svg>
        </button>
      </div>

      <div class="sci-grid" id="sciGrid">
        <button class="btn sci" data-insert="√(">√</button>
        <button class="btn sci" data-insert="π">π</button>
        <button class="btn sci" data-insert="^">^</button>
        <button class="btn sci" data-insert="!">!</button>

        <button class="btn sci" data-action="angle" id="angleBtn">Deg</button>
        <button class="btn sci inv-swap" data-primary='{"label":"sin","insert":"sin("}' data-secondary='{"label":"sin⁻¹","insert":"asin("}'>sin</button>
        <button class="btn sci inv-swap" data-primary='{"label":"cos","insert":"cos("}' data-secondary='{"label":"cos⁻¹","insert":"acos("}'>cos</button>
        <button class="btn sci inv-swap" data-primary='{"label":"tan","insert":"tan("}' data-secondary='{"label":"tan⁻¹","insert":"atan("}'>tan</button>

        <button class="btn sci" data-action="inv" id="invBtn">Inv</button>
        <button class="btn sci" data-insert="e">e</button>
        <button class="btn sci inv-swap" data-primary='{"label":"ln","insert":"ln("}' data-secondary='{"label":"eˣ","insert":"e^"}'>ln</button>
        <button class="btn sci inv-swap" data-primary='{"label":"log","insert":"log("}' data-secondary='{"label":"10ˣ","insert":"10^"}'>log</button>
      </div>

      <div class="basic-grid">
        <button class="btn util filled" data-action="clear">AC</button>
        <button class="btn util" data-action="paren">( )</button>
        <button class="btn util" data-insert="%">%</button>
        <button class="btn util" data-insert="÷">÷</button>

        <button class="btn num" data-insert="7">7</button>
        <button class="btn num" data-insert="8">8</button>
        <button class="btn num" data-insert="9">9</button>
        <button class="btn util" data-insert="×">×</button>

        <button class="btn num" data-insert="4">4</button>
        <button class="btn num" data-insert="5">5</button>
        <button class="btn num" data-insert="6">6</button>
        <button class="btn util" data-insert="−">−</button>

        <button class="btn num" data-insert="1">1</button>
        <button class="btn num" data-insert="2">2</button>
        <button class="btn num" data-insert="3">3</button>
        <button class="btn util" data-insert="+">+</button>

        <button class="btn num" data-insert="0">0</button>
        <button class="btn num" data-insert=".">.</button>
        <button class="btn util" data-action="back" aria-label="Backspace">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 5H9l-7 7 7 7h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/>
            <line x1="18" y1="9" x2="12" y2="15"/>
            <line x1="12" y1="9" x2="18" y2="15"/>
          </svg>
        </button>
        <button class="btn util filled equals" data-action="equals">=</button>
      </div>
    </main>

    <main class="view converter-view" id="converterView">
      <div class="converter-header">
        <button class="icon-btn ghost" id="convBackBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <h2>Converter</h2>
        <select id="conv-category" class="conv-select"></select>
      </div>
      <div class="converter-body">
        <div class="conv-field">
          <select id="conv-from" class="conv-unit"></select>
          <input type="text" inputmode="decimal" id="conv-from-input" class="conv-value" placeholder="0" />
        </div>
        <div class="conv-swap-wrap">
          <button id="conv-swap" class="conv-swap" aria-label="Swap units">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4M7 4L3 8M7 4l4 4"/>
              <path d="M17 8v12M17 20l4-4M17 20l-4-4"/>
            </svg>
          </button>
        </div>
        <div class="conv-field">
          <select id="conv-to" class="conv-unit"></select>
          <input type="text" inputmode="decimal" id="conv-to-input" class="conv-value" placeholder="0" />
        </div>
      </div>
    </main>

    <aside class="history-panel" id="historyPanel" aria-hidden="true">
      <div class="history-header">
        <h2>History</h2>
        <div class="history-actions">
          <button class="text-btn" id="clearHistoryBtn">Clear</button>
          <button class="icon-btn ghost" id="closeHistoryBtn" aria-label="Close">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No history yet</div>
      </div>
    </aside>

    <aside class="settings-panel" id="settingsPanel" aria-hidden="true">
      <div class="settings-header">
        <button class="icon-btn ghost" id="closeSettingsBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <h2>Settings</h2>
      </div>
      <div class="settings-body">
        <section>
          <h3>Theme</h3>
          <div class="theme-grid" id="themeGrid"></div>
        </section>
        <section>
          <h3>Customize</h3>
          <div class="custom-colors" id="customColors"></div>
          <button class="text-btn" id="resetCustomBtn">Reset to theme</button>
        </section>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>
  </div>

  <script src="themes.js"></script>
  <script src="units.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
